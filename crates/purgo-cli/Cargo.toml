[package]
name = "purgo-cli"
description = "Command-line driving adapter and composition root for purgo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "purgo"
path = "src/main.rs"

[dependencies]
purgo-domain = { path = "../purgo-domain" }
purgo-application = { path = "../purgo-application" }
purgo-adapters = { path = "../purgo-adapters" }

[dev-dependencies]
# Used by the e2e tests to build valid fixtures for the `purgo` binary.
lopdf = { version = "0.40", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
# Used by the e2e test to generate a seed key and verify the `.sig` the binary
# emits — exercising the signing path end to end with an independent verifier.
ed25519-dalek = { version = "2", default-features = false }

[lints]
workspace = true
